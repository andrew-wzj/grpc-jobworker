<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grpc-jobworker</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>grpc-jobworker</h1>
      <p>Run shell commands as background jobs and watch their output live.</p>
    </div>
    <dl class="stats" id="stats"></dl>
  </header>

  <main>
    <section class="panel" id="tokenPanel" hidden>
      <h2>Authentication required</h2>
      <p>This server requires an API token.</p>
      <form id="tokenForm" class="row">
        <input id="tokenInput" type="password" placeholder="API token" autocomplete="off" required>
        <button type="submit">Save token</button>
      </form>
    </section>

    <section class="panel">
      <h2>New job</h2>
      <form id="runForm" class="run-form">
        <input id="nameInput" placeholder="Name (optional)" maxlength="200">
        <input id="cmdInput" class="mono" placeholder="Command, e.g. for i in 1 2 3; do echo $i; sleep 1; done" required>
        <button type="submit">Run</button>
      </form>
      <p class="error" id="runError" hidden></p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="filters" id="filters" role="tablist">
          <button data-filter="all" class="active">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="completed">Completed</button>
          <button data-filter="failed">Failed</button>
          <button data-filter="stopped">Stopped</button>
        </div>
        <input id="search" type="search" placeholder="Search name, ID or command">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Status</th><th>Created</th><th>Duration</th><th>Exit</th><th></th></tr>
          </thead>
          <tbody id="jobs"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>No jobs yet. Run one above.</p>
    </section>
  </main>

  <dialog id="logDialog">
    <div class="dialog-head">
      <div>
        <h2 id="logTitle"></h2>
        <code id="logCmd"></code>
      </div>
      <button id="logClose" class="ghost" aria-label="Close">✕</button>
    </div>
    <pre id="logOutput"></pre>
    <p class="muted" id="logState"></p>
  </dialog>
</body>
</html>
